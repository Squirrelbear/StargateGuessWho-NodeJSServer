<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stargate Guess Who | Admin</title>
    <style>
        :root { color-scheme: light; font-family: Arial, sans-serif; background: #eef1f4; color: #17202a; }
        body { margin: 0; }
        header { background: #152a3a; color: white; padding: 24px clamp(20px, 5vw, 64px); }
        header h1 { margin: 0 0 6px; font-size: 1.7rem; }
        header p { margin: 0; color: #b9c8d2; }
        main { max-width: 1100px; margin: 0 auto; padding: 24px clamp(20px, 5vw, 64px); }
        .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        input, button { box-sizing: border-box; border: 1px solid #b9c4cc; border-radius: 4px; padding: 10px 12px; font: inherit; }
        select { box-sizing: border-box; border: 1px solid #b9c4cc; border-radius: 4px; padding: 10px 12px; font: inherit; background: white; }
        input { flex: 1 1 280px; min-width: 0; }
        button { background: #d46936; border-color: #b85526; color: white; cursor: pointer; }
        button:hover { background: #b85526; }
        #summary { color: #52616b; margin: 0 0 14px; }
        .message { background: white; border-left: 4px solid #d46936; padding: 16px; }
        .sessions { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 14px; }
        .session { min-width: 0; background: white; border: 1px solid #d6dde2; border-radius: 4px; padding: 18px; box-shadow: 0 2px 5px #152a3a12; }
        .session h2 { margin: 0 0 12px; font-size: 1.2rem; }
        .status { display: inline-block; border-radius: 3px; padding: 4px 7px; background: #dcefe4; color: #17633a; font-size: .85rem; font-weight: bold; }
        .status.waiting { background: #fff0c7; color: #775b00; }
        dl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 16px 0 0; }
        dt { color: #687780; } dd { margin: 0; text-align: right; font-weight: bold; }
        ul { margin: 12px 0 0; padding-left: 20px; }
        details { margin-top: 16px; border: 1px solid #d6dde2; border-radius: 4px; background: #f8fafb; }
        summary { cursor: pointer; padding: 10px 12px; font-weight: bold; color: #152a3a; }
        .session-details { min-width: 0; overflow-x: auto; padding: 0 12px 12px; }
        .session-details pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: .8rem; line-height: 1.5; }
        .session-table { width: max-content; min-width: 100%; border-collapse: collapse; margin-top: 8px; }
        .session-table th, .session-table td { text-align: left; border-bottom: 1px solid #e5e9ec; padding: 6px 0; font-size: .8rem; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid #d6dde2; }
        .tabs button { border-radius: 4px 4px 0 0; background: #eef1f4; border-color: #d6dde2; color: #52616b; }
        .tabs button.active { background: #152a3a; border-color: #152a3a; color: white; }
        .view[hidden] { display: none; }
        .logs { background: white; border: 1px solid #d6dde2; overflow-x: auto; }
        .logs table { border-collapse: collapse; min-width: 760px; width: 100%; }
        th, td { border-bottom: 1px solid #e5e9ec; padding: 10px 12px; text-align: left; vertical-align: top; }
        th { background: #f5f7f8; color: #52616b; font-size: .85rem; }
        td { font-size: .9rem; }
        td:first-child { white-space: nowrap; }
        code { white-space: pre-wrap; overflow-wrap: anywhere; }
        .log-details { min-width: 220px; margin-top: 0; }
        .log-details summary { cursor: pointer; color: #152a3a; padding: 0; }
        .log-details summary code { white-space: normal; overflow-wrap: anywhere; }
        .log-details pre { max-width: 520px; margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
        @media (max-width: 480px) { dl { grid-template-columns: 1fr; } dd { text-align: left; } }
    </style>
</head>
<body>
    <header>
        <h1>Game session monitor</h1>
        <p>Operational view</p>
    </header>
    <main>
        <form class="toolbar" id="token-form">
            <input id="token" type="password" autocomplete="current-password" placeholder="Admin token" aria-label="Admin token">
            <button type="submit">Load sessions</button>
        </form>
        <p id="summary" role="status">Enter an admin token to load current sessions.</p>
        <nav class="tabs" aria-label="Admin views">
            <button type="button" class="active" data-view="sessions-view">Sessions</button>
            <button type="button" data-view="logs-view">Logs</button>
            <button type="button" data-view="admin-functions-view">Admin functions</button>
        </nav>
        <section class="view" id="sessions-view">
            <section class="sessions" id="sessions" aria-live="polite"></section>
        </section>
        <section class="view" id="logs-view" hidden>
            <form class="toolbar" id="logs-form">
                <select id="instance" aria-label="Server instance"></select>
                <select id="category" aria-label="Event type">
                    <option value="">All event types</option>
                    <option value="server">Server events</option>
                    <option value="player">Player events</option>
                    <option value="session">Game session events</option>
                </select>
                <input id="player-filter" placeholder="Player name or ID" aria-label="Player name or ID">
                <input id="session-filter" placeholder="Session code or ID" aria-label="Session code or ID">
                <button type="submit">Load logs</button>
            </form>
            <div class="logs" aria-live="polite">
                <table>
                    <thead><tr><th>Time</th><th>Type</th><th>Event</th><th>Player</th><th>Session</th><th>Details</th></tr></thead>
                    <tbody id="logs-body"></tbody>
                </table>
            </div>
        </section>
        <section class="view" id="admin-functions-view" hidden>
            <div class="session">
                <h2>Server actions</h2>
                <p>These actions affect the running server and cannot be undone.</p>
                <form class="toolbar" id="kill-session-form">
                    <input id="game-id" inputmode="numeric" placeholder="Game ID" aria-label="Game ID" required>
                    <button type="submit">Kill game session</button>
                </form>
                <form class="toolbar" id="clear-logs-form">
                    <button type="submit">Clear all log files</button>
                </form>
                <form class="toolbar" id="kill-server-form">
                    <button type="submit">Kill server</button>
                </form>
            </div>
        </section>
    </main>
    <script>
        const tokenInput = document.getElementById('token');
        const summary = document.getElementById('summary');
        const sessionsElement = document.getElementById('sessions');
        const logsBody = document.getElementById('logs-body');
        const instanceSelect = document.getElementById('instance');
        let refreshTimer;

        tokenInput.value = sessionStorage.getItem('adminToken') || '';

        function getExpandedSessionCodes() {
            try {
                return JSON.parse(sessionStorage.getItem('adminExpandedSessions') || '[]');
            } catch (error) {
                return [];
            }
        }

        function setExpandedSessionCodes(codes) {
            sessionStorage.setItem('adminExpandedSessions', JSON.stringify(codes));
        }

        function persistExpandedSessionState() {
            const expandedCodes = Array.from(document.querySelectorAll('.session details[open]')).map(details => details.dataset.sessionCode);
            setExpandedSessionCodes(expandedCodes);
        }

        function sessionStatus(session) {
            return session.playerCount < session.playerLimit ? 'Waiting' : 'In progress';
        }

        function renderSessions(sessions) {
            const expandedCodes = new Set(getExpandedSessionCodes());
            sessionsElement.replaceChildren();
            if (sessions.length === 0) {
                sessionsElement.innerHTML = '<div class="message">No active sessions.</div>';
                return;
            }
            sessions.forEach(session => {
                const status = sessionStatus(session);
                const card = document.createElement('article');
                card.className = 'session';

                const playerRows = session.players.map(player => `
                    <tr>
                        <td>${escapeHtml(player.name)}</td>
                        <td>${escapeHtml(player.playerID)}</td>
                        <td>${escapeHtml(player.chosenID)}</td>
                        <td>${escapeHtml(player.guessID)}</td>
                        <td>${escapeHtml(player.lastChosenID)}</td>
                        <td>${escapeHtml(player.lastGuessID)}</td>
                    </tr>
                `).join('');

                const details = session.state ? `
                    <details data-session-code="${escapeHtml(session.sessionCode)}" ${expandedCodes.has(session.sessionCode) ? 'open' : ''}>
                        <summary>View detailed session state</summary>
                        <div class="session-details">
                            <table class="session-table">
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>ID</th>
                                        <th>Chosen</th>
                                        <th>Guess</th>
                                        <th>Last chosen</th>
                                        <th>Last guess</th>
                                    </tr>
                                </thead>
                                <tbody>${playerRows}</tbody>
                            </table>
                            <pre>${escapeHtml(JSON.stringify(session.state, null, 2))}</pre>
                        </div>
                    </details>
                ` : '';

                card.innerHTML = `
                    <h2>Session ${session.sessionCode}</h2>
                    <span class="status ${status === 'Waiting' ? 'waiting' : ''}">${status}</span>
                    <dl>
                        <dt>Players</dt><dd>${session.playerCount}/${session.playerLimit}</dd>
                        <dt>Round</dt><dd>${session.round}</dd>
                        <dt>Last activity</dt><dd>${session.secondsSinceActivity}s ago</dd>
                    </dl>
                    <ul>${session.players.map(player => `<li>${escapeHtml(player.name)}</li>`).join('')}</ul>
                    ${details}
                `;
                sessionsElement.appendChild(card);
            });

            persistExpandedSessionState();
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));
        }

        function renderLogDetails(log) {
            const details = log.details || {};
            if (details.action !== 'characterCommand') {
                return `<code>${escapeHtml(JSON.stringify(details))}</code>`;
            }

            const summary = {
                action : details.action,
                characterAction : details.characterAction,
                characterID : details.characterID
            };
            return `<details class="log-details">
                <summary><code>${escapeHtml(JSON.stringify(summary))}</code></summary>
                <pre>${escapeHtml(JSON.stringify(details, null, 2))}</pre>
            </details>`;
        }

        async function loadSessions() {
            const token = tokenInput.value.trim();
            const previousScrollPosition = window.scrollY;
            sessionStorage.setItem('adminToken', token);
            summary.textContent = 'Loading...';
            try {
                const response = await fetch('/admin/api/sessions', {headers : {Authorization : `Bearer ${token}`}});
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Unable to load sessions.');
                renderSessions(data.sessions);
                window.scrollTo({top : previousScrollPosition, behavior : 'auto'});
                summary.textContent = `${data.sessions.length} active session${data.sessions.length === 1 ? '' : 's'} | Updated ${new Date().toLocaleTimeString()}`;
            } catch (error) {
                sessionsElement.replaceChildren();
                summary.textContent = error.message;
            }
        }

        function formatInstance(instance) {
            return `${instance.instanceID}${instance.instanceID === instanceSelect.dataset.current ? ' (current)' : ''}`;
        }

        async function loadInstances() {
            const response = await fetch('/admin/api/logs/instances', {headers : {Authorization : `Bearer ${tokenInput.value.trim()}`}});
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Unable to load log instances.');
            instanceSelect.dataset.current = data.currentInstanceID;
            instanceSelect.replaceChildren();
            data.instances.forEach(instance => {
                const option = new Option(formatInstance(instance), instance.instanceID);
                instanceSelect.appendChild(option);
            });
        }

        async function loadLogs() {
            const params = new URLSearchParams({instanceID : instanceSelect.value});
            [['category', 'category'], ['player', 'player-filter'], ['session', 'session-filter']].forEach(([name, id]) => {
                const value = document.getElementById(id).value.trim();
                if (value) params.set(name, value);
            });
            const response = await fetch(`/admin/api/logs?${params}`, {headers : {Authorization : `Bearer ${tokenInput.value.trim()}`}});
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Unable to load logs.');
            logsBody.replaceChildren();
            data.logs.forEach(log => {
                const row = document.createElement('tr');
                row.innerHTML = `<td>${escapeHtml(new Date(log.timestamp).toLocaleString())}</td><td>${escapeHtml(log.category)}</td><td>${escapeHtml(log.event)}</td><td>${escapeHtml(log.playerName || '')}</td><td>${escapeHtml(log.sessionCode || log.sessionID || '')}</td><td>${renderLogDetails(log)}</td>`;
                logsBody.appendChild(row);
            });
            summary.textContent = `${data.logs.length} log event${data.logs.length === 1 ? '' : 's'} | Updated ${new Date().toLocaleTimeString()}`;
        }

        async function runAdminAction(url, options = {}) {
            const response = await fetch(url, {
                method : 'POST',
                headers : {'Content-Type' : 'application/json', Authorization : `Bearer ${tokenInput.value.trim()}`},
                ...options
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Unable to complete admin action.');
            return data;
        }

        document.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', async () => {
            document.querySelectorAll('[data-view]').forEach(tab => tab.classList.remove('active'));
            button.classList.add('active');
            document.querySelectorAll('.view').forEach(view => view.hidden = view.id !== button.dataset.view);
            if (button.dataset.view === 'logs-view') {
                try { await loadInstances(); await loadLogs(); } catch (error) { summary.textContent = error.message; }
            }
        }));

        sessionsElement.addEventListener('toggle', event => {
            if (event.target instanceof HTMLDetailsElement) {
                persistExpandedSessionState();
            }
        }, true);

        document.getElementById('logs-form').addEventListener('submit', async event => {
            event.preventDefault();
            try { await loadLogs(); } catch (error) { summary.textContent = error.message; }
        });

        document.getElementById('kill-session-form').addEventListener('submit', async event => {
            event.preventDefault();
            const gameID = document.getElementById('game-id').value.trim();
            if (!confirm(`Kill game session ${gameID}?`)) return;
            try {
                await runAdminAction('/admin/api/actions/kill-session', {body : JSON.stringify({sessionID : gameID})});
                summary.textContent = `Game session ${gameID} was killed.`;
                await loadSessions();
            } catch (error) { summary.textContent = error.message; }
        });

        document.getElementById('clear-logs-form').addEventListener('submit', async event => {
            event.preventDefault();
            if (!confirm('Clear all log files? This cannot be undone.')) return;
            try {
                await runAdminAction('/admin/api/actions/clear-logs');
                summary.textContent = 'All log files were cleared.';
            } catch (error) { summary.textContent = error.message; }
        });

        document.getElementById('kill-server-form').addEventListener('submit', async event => {
            event.preventDefault();
            if (!confirm('Kill the server? All connected clients will be disconnected.')) return;
            try {
                await runAdminAction('/admin/api/actions/kill-server');
                summary.textContent = 'Server shutdown initiated.';
            } catch (error) { summary.textContent = error.message; }
        });

        document.getElementById('token-form').addEventListener('submit', event => {
            event.preventDefault();
            loadSessions();
            loadInstances().catch(error => summary.textContent = error.message);
            clearInterval(refreshTimer);
            refreshTimer = setInterval(loadSessions, 10000);
        });
    </script>
</body>
</html>
